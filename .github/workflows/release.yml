name: release

on:
  push:
    branches:
      - release

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: get version
        id: version
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: create tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            exit 0
          fi

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: pnpm dlx changelogithub@14 --to "$TAG_NAME" --output .release-notes.md

      - name: create draft release
        id: release
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const tagName = process.env.TAG_NAME;
            const body = fs.readFileSync('.release-notes.md', 'utf8');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const existingRelease = releases.find((release) => release.tag_name === tagName);

            if (existingRelease && !existingRelease.draft) {
              throw new Error(`Release ${tagName} is already published`);
            }

            const { data: release } = existingRelease
              ? await github.rest.repos.updateRelease({
                  owner,
                  repo,
                  release_id: existingRelease.id,
                  name: tagName,
                  body,
                  draft: true,
                  prerelease: false,
                })
              : await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: tagName,
                  body,
                  draft: true,
                  prerelease: false,
                });

            core.setOutput('release_id', release.id);

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend  dependencies
        run: pnpm ci

      - uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseAssetNamePattern: "[name]_[version]_[arch]-setup[ext]"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs:
      - create-release
      - publish-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: publish release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
